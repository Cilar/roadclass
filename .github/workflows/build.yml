name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip Windows junk files
        run: find . \( -name "desktop.ini" -o -name "Thumbs.db" -o -name ".DS_Store" \) -delete

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Publish log on failure
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p build-logs
          tail -c 60000 build.log > build-logs/latest-failure.log
          git config user.name "ci"
          git config user.email "ci@local"
          git add -f build-logs/latest-failure.log
          git commit -m "CI log [skip ci]" || true
          git push || true
          exit 1

      - name: Rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/RoadClass.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RoadClass-APK
          path: out/RoadClass.apk
          if-no-files-found: error
